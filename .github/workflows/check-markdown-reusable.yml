# Reusable workflow for checking Markdown fence balance across content repos
# Called by content repos like math_grade_1, python_intro, etc.
# 
# This is the single source of truth - update here and all repos benefit

name: Check Markdown Fences (Reusable)

# The checkout token only needs to read the calling repository.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      slides-path:
        description: 'Path to slides directory'
        required: false
        type: string
        default: 'slides'

jobs:
  check-fences:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          fetch-depth: 2  # Only need enough history for comparison, not full history

      - name: Create validation script
        run: |
          mkdir -p .pandoc_template/scripts
          cat << 'PY_SCRIPT_EOF' > .pandoc_template/scripts/validate_fences.py
          #!/usr/bin/env python3
          """
          Validate that all Pandoc fenced divs in Markdown files are properly balanced.
          
          Pandoc permits any run of three or more colons. A tagged run opens a
          div and a colon-only run closes the most recent div, regardless of
          delimiter width.
          """
          
          import sys
          import os
          import subprocess
          import argparse
          import re
          from pathlib import Path


          OPEN = re.compile(r'^:{3,}\s*(?:\{.*\}|[A-Za-z][\w-]*)\s*$')
          CLOSE = re.compile(r'^:{3,}\s*$')
          HTML_COMMENT = re.compile(r'<!--.*?-->', re.DOTALL)


          def visible_source(text: str) -> str:
              """Remove HTML comments while preserving their newline count."""
              return HTML_COMMENT.sub(
                  lambda match: '\n' * match.group(0).count('\n'), text
              )
          
          
          def validate_fence_structure(filepath: str) -> list[str]:
              """
              Validate the structure of :::: fence blocks in a markdown file.
              
              Returns a list of issues found, empty if file is valid.
              """
              try:
                  with open(filepath, 'r', encoding='utf-8') as f:
                      lines = visible_source(f.read()).splitlines()
              except Exception as e:
                  return [f"Could not read file: {e}"]
              
              stack = []
              issues = []
              
              for i, line in enumerate(lines, 1):
                  if OPEN.match(line):
                      stack.append((i, line.strip()))
                  elif CLOSE.match(line):
                      # Pandoc closes the most recently opened fenced div. The
                      # closer width need not match the opener, and three-colon
                      # divs participate in the same stack.
                      if stack:
                          stack.pop()
                      else:
                          issues.append(
                              f"Line {i}: Orphaned closing {line.strip()} "
                              "(no matching opening tag)"
                          )
              
              # Check for unclosed blocks
              for line_num, opener in stack:
                  issues.append(f"Line {line_num}: Unclosed {opener} block")
              
              return issues
          
          
          def main():
              parser = argparse.ArgumentParser(description='Validate Pandoc fenced-div balance in Markdown files')
              parser.add_argument('files', nargs='*', help='Files to check')
              parser.add_argument('--from-nul-list', metavar='FILE',
                                  help='Read NUL-separated paths from FILE (safe for any filename)')
              args = parser.parse_args()
              
              files = list(args.files)
              if args.from_nul_list:
                  with open(args.from_nul_list, 'rb') as f:
                      files.extend(p.decode('utf-8') for p in f.read().split(b'\0') if p)
              
              if not files:
                  print("No files to check.")
                  sys.exit(0)
              
              # Validate each file
              total_issues = 0
              files_with_issues = 0
              
              for filepath in files:
                  if not os.path.exists(filepath):
                      print(f"⚠️  File not found: {filepath}")
                      continue
                      
                  issues = validate_fence_structure(filepath)
                  
                  if issues:
                      files_with_issues += 1
                      total_issues += len(issues)
                      print(f"\n❌ {filepath}")
                      for issue in issues:
                          print(f"   {issue}")
                  else:
                      print(f"✅ {filepath}")
              
              # Summary
              print(f"\n{'=' * 50}")
              print(f"Files with issues: {files_with_issues}")
              print(f"Total issues: {total_issues}")
              
              if total_issues > 0:
                  print("\n⚠️  Some files have unbalanced :::: fences!")
                  sys.exit(1)
              else:
                  print("\n✅ All files have balanced :::: fences!")
                  sys.exit(0)
          
          
          if __name__ == '__main__':
              main()
          PY_SCRIPT_EOF

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Find changed Markdown files
        id: changed-files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LIST=.pandoc_template/changed_md.lst
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$BEFORE_SHA"
          fi

          # The checkout is shallow (fetch-depth 2), so the base of a
          # multi-commit push or a PR is usually not present. Fetch it by SHA;
          # if that fails, or this is the first push (all-zero "before" SHA),
          # check every tracked Markdown file instead of silently passing.
          # The old "HEAD^ || true" version reported success on an initial
          # commit without checking anything.
          if [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
             && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          fi
          if [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            # --no-renames: a renamed file must show up as an addition under
            # its new path, or a rename that also breaks a fence is skipped.
            git diff -z --no-renames --name-only --diff-filter=ACM "$BASE_SHA" "$HEAD_SHA" -- '*.md' > "$LIST"
          else
            echo "No usable base commit; checking every tracked Markdown file."
            git ls-files -z -- '*.md' > "$LIST"
          fi

          # NUL-delimited so a filename with spaces or shell metacharacters is
          # never split or interpreted; the validator reads the list directly.
          COUNT=$(tr -cd '\0' < "$LIST" | wc -c)
          if [ "$COUNT" -eq 0 ]; then
            echo "No Markdown files changed"
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "Markdown files to check ($COUNT):"
            tr '\0' '\n' < "$LIST"
          fi

      - name: Validate fence balance
        if: steps.changed-files.outputs.has_files == 'true'
        run: |
          python .pandoc_template/scripts/validate_fences.py --from-nul-list .pandoc_template/changed_md.lst

      - name: Report success
        if: steps.changed-files.outputs.has_files == 'false'
        run: |
          echo "✅ No Markdown files changed, skipping validation"
